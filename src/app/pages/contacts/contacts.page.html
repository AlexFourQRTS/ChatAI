<ion-header [translucent]="true" class="contacts-header">
  <ion-toolbar class="contacts-toolbar">
    <ion-title class="contacts-toolbar-title">Contacts</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="contacts-page">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large" class="contacts-large-title">Contacts</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="contacts-search-wrap">
    <label class="contacts-search" aria-label="Search contacts">
      <ion-icon name="search-outline" class="contacts-search-icon" aria-hidden="true"></ion-icon>
      <input type="search" class="contacts-search-input" placeholder="Search contacts..." autocomplete="off" />
    </label>
  </div>

  <section class="contacts-section" aria-labelledby="contacts-on-heading">
    <h2 id="contacts-on-heading" class="contacts-section-heading">{{ sectionOn }}</h2>
    <div class="contacts-list" role="list">
      @for (c of onPicTalk(); track c.id) {
        <button
          type="button"
          class="contacts-row contacts-row-chat"
          role="listitem"
          (click)="openChat(c.id)"
          [attr.aria-label]="'Open chat with ' + c.name"
        >
          <div class="contacts-avatar" [style.background]="c.avatarColor">{{ c.initials }}</div>
          <div class="contacts-label">
            <div class="contacts-name">{{ c.name }}</div>
            <div class="contacts-phone">{{ c.phone }}</div>
          </div>
          <span class="contacts-chat-fab" aria-hidden="true">
            <ion-icon name="chatbubble-outline"></ion-icon>
          </span>
        </button>
      }
    </div>
  </section>

  <section class="contacts-section" aria-labelledby="contacts-invite-heading">
    <h2 id="contacts-invite-heading" class="contacts-section-heading">{{ sectionInvite }}</h2>
    <div class="contacts-list" role="list">
      @for (c of inviteList(); track c.id) {
        <div class="contacts-row contacts-row-invite" role="listitem">
          <div class="contacts-avatar contacts-avatar-invite" aria-hidden="true">
            <ion-icon name="person-add-outline"></ion-icon>
          </div>
          <div class="contacts-label">
            <div class="contacts-name">{{ c.name }}</div>
            <div class="contacts-phone">{{ c.phone }}</div>
          </div>
          <ion-button
            type="button"
            class="contacts-invite-btn"
            fill="outline"
            size="small"
            (click)="onInvite(c, $event)"
          >
            Invite
          </ion-button>
        </div>
      }
    </div>
  </section>
</ion-content>
