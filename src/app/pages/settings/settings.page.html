<ion-header [translucent]="true" class="settings-header">
  <ion-toolbar class="settings-toolbar">
    <ion-title class="settings-toolbar-title">Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="settings-page">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large" class="settings-large-title">Settings</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="settings-profile-block">
    <div class="settings-avatar-wrap" (click)="onChangePhoto()">
      @if (profile().photoUrl) {
        <img class="settings-avatar-img" [src]="profile().photoUrl" alt="" />
      } @else {
        <div class="settings-avatar" [style.background]="profile().avatarColor">
          {{ profile().initials }}
        </div>
      }
      <ion-button
        class="settings-camera-btn"
        fill="solid"
        shape="round"
        aria-label="Change profile photo"
        (click)="$event.stopPropagation(); onChangePhoto()"
      >
        <ion-icon slot="icon-only" name="camera-outline"></ion-icon>
      </ion-button>
    </div>
    <p class="settings-photo-hint">Tap to change photo</p>
  </div>

  <div class="settings-fields">
    <div class="settings-field">
      <div class="settings-field-head">
        <span class="settings-field-label">Name</span>
        <ion-button
          fill="clear"
          size="small"
          class="settings-edit-btn"
          aria-label="Edit name"
          (click)="onEditName()"
        >
          <ion-icon slot="icon-only" name="create-outline"></ion-icon>
        </ion-button>
      </div>
      <p class="settings-field-value">{{ profile().displayName }}</p>
    </div>

    <div class="settings-field">
      <span class="settings-field-label">Phone</span>
      <p class="settings-field-value">{{ profile().phone }}</p>
    </div>

    <div class="settings-field settings-field-theme">
      <span class="settings-field-label">Appearance</span>
      <div class="settings-theme-toggle" role="group" aria-label="Theme">
        <button
          type="button"
          class="settings-theme-native"
          [class.settings-theme-native--active]="theme.mode() === 'light'"
          (click)="setTheme('light')"
        >
          Light
        </button>
        <button
          type="button"
          class="settings-theme-native"
          [class.settings-theme-native--active]="theme.mode() === 'dark'"
          (click)="setTheme('dark')"
        >
          Dark
        </button>
      </div>
    </div>
  </div>

  <p class="settings-beta" aria-label="Beta version">{{ betaLabel }}</p>
</ion-content>
