<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" disabled="true" aria-hidden="true">
        <ion-icon slot="icon-only" color="primary" name="sparkles-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Chats</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Chats</ion-title>
    </ion-toolbar>
  </ion-header>

  <p class="demo-caption">
    <ion-icon name="color-wand-outline" class="inline-icon" aria-hidden="true"></ion-icon>
    Animation demo (content only).
  </p>

  @if (showBanner()) {
    <div class="banner" @fadeSlide>
      <ion-icon name="layers-outline" class="banner-icon" aria-hidden="true"></ion-icon>
      Fade / slide in &amp; out
    </div>
  }

  <div class="card scale-card" [@scaleToggle]="scaleState()">
    <div class="card-title-row">
      <ion-icon name="layers-outline" color="primary" aria-hidden="true"></ion-icon>
      <h2 class="card-title">Scale &amp; tilt</h2>
    </div>
    <p class="card-text">Angular state animation toggles between two states on a timer.</p>
  </div>

  <div class="card shimmer-card" [@shimmer]="shimmerTick()">
    <div class="card-title-row">
      <ion-icon name="color-wand-outline" color="tertiary" aria-hidden="true"></ion-icon>
      <h2 class="card-title">Shimmer sweep</h2>
    </div>
    <p class="card-text">Keyframes move a gradient highlight across the surface.</p>
  </div>

  <div class="orbit-header">
    <ion-icon name="planet-outline" class="orbit-planet-icon" aria-hidden="true"></ion-icon>
    <div class="orbit-wrap" aria-hidden="true">
      <span class="orbit-dot"></span>
    </div>
  </div>
  <p class="demo-caption orbit-label">Pure CSS orbit (separate from Angular triggers).</p>
</ion-content>
