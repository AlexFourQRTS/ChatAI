<ion-header [translucent]="true" class="inbox-header">
  <ion-toolbar class="inbox-toolbar">
    <ion-buttons slot="start" class="inbox-brand-wrap">
      <app-ai-messenger-icon [size]="28" />
    </ion-buttons>
    <ion-title class="inbox-toolbar-title">{{ appName }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="inbox-page">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large" class="inbox-large-title">{{ appName }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="inbox-search-wrap">
    <label class="inbox-search" aria-label="Search chats">
      <ion-icon name="search-outline" class="inbox-search-icon" aria-hidden="true"></ion-icon>
      <input type="search" class="inbox-search-input" placeholder="Search chats..." autocomplete="off" />
    </label>
  </div>

  <div class="inbox-list" role="list">
    @for (t of threads(); track t.id) {
      <button type="button" class="inbox-row" role="listitem" (click)="openThread(t.id)">
        <div class="inbox-avatar" [style.background]="t.avatarColor">{{ t.initials }}</div>
        <div class="inbox-label">
          <div class="inbox-label-top">
            <span class="inbox-name">{{ t.name }}</span>
            <span class="inbox-time">{{ t.time }}</span>
          </div>
          <div class="inbox-label-bottom">
            @if (t.previewStrip) {
              <div class="inbox-preview-strip" aria-hidden="true"></div>
            } @else {
              <p class="inbox-preview">{{ t.preview }}</p>
            }
            @if (t.unread) {
              <span class="inbox-unread">{{ t.unread > 99 ? '99+' : t.unread }}</span>
            }
          </div>
        </div>
      </button>
    }
  </div>
</ion-content>
