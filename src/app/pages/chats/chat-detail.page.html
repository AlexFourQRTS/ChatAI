<ion-header class="cd-header" [translucent]="false">
  <ion-toolbar class="cd-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/chats" text="" class="cd-back"></ion-back-button>
    </ion-buttons>
    <ion-title class="cd-title-wrap">
      <div class="cd-title-inner">
        <div class="cd-avatar-sm" [style.background]="thread().avatarColor">{{ thread().initials }}</div>
        <div class="cd-title-text">
          <span class="cd-name">{{ thread().name }}</span>
          <span class="cd-status">{{ thread().online ? 'online' : 'offline' }}</span>
        </div>
      </div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" class="cd-more" aria-label="More">
        <ion-icon slot="icon-only" name="ellipsis-vertical-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="cd-content">
  <div class="cd-thread">
    @for (msg of messages(); track msg.id) {
      <div class="cd-row" [class.cd-row-me]="msg.from === 'me'">
        <div class="cd-bubble" [class.cd-bubble-me]="msg.from === 'me'">
          <div class="cd-bubble-visual" [style.background]="msg.gradient"></div>
        </div>
        <div class="cd-meta" [class.cd-meta-me]="msg.from === 'me'">
          <span class="cd-time">{{ msg.time }}</span>
          <button type="button" class="cd-show" (click)="openPreview(msg)">
            <ion-icon name="eye-outline" aria-hidden="true"></ion-icon>
            Show
          </button>
        </div>
      </div>
    }
  </div>
</ion-content>

<ion-footer class="cd-footer">
  <div class="cd-composer">
    <ion-icon name="images-outline" class="cd-composer-icon" aria-hidden="true"></ion-icon>
    <input
      type="text"
      class="cd-composer-input"
      placeholder="Describe to generate or upload an image"
      aria-label="Message"
    />
    <button type="button" class="cd-send" aria-label="Send">
      <ion-icon name="send-outline" aria-hidden="true"></ion-icon>
    </button>
  </div>
</ion-footer>

<ion-modal
  [isOpen]="modalOpen()"
  (didDismiss)="closeModal()"
  [backdropDismiss]="true"
  cssClass="cd-prompt-modal"
>
  <ng-template>
    <div class="cd-modal-card">
      <div class="cd-modal-visual">
        <div class="cd-modal-gradient" [style.background]="activeBubble()?.gradient ?? ''"></div>
        <button type="button" class="cd-modal-close" (click)="closeModal()" aria-label="Close">
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </div>
      <div class="cd-modal-body">
        <p class="cd-modal-label">YOUR PROMPT</p>
        <p class="cd-modal-prompt">{{ displayPrompt() }}</p>
        @if (editPromptMode()) {
          <div class="cd-modal-edit-card">
            <p class="cd-modal-label">NEW PROMPT</p>
            <input
              type="text"
              class="cd-modal-input"
              [value]="draftPrompt()"
              (input)="onDraftInput($event)"
            />
            <div class="cd-modal-edit-actions">
              <button type="button" class="cd-link" (click)="cancelEditPrompt()">Cancel</button>
              <button type="button" class="cd-apply" (click)="applyPromptEdit()">Apply</button>
            </div>
          </div>
        }
        <div class="cd-modal-actions">
          <button type="button" class="cd-btn-outline" (click)="onRegenerate()">
            <ion-icon name="refresh-outline" aria-hidden="true"></ion-icon>
            Regenerate
          </button>
          <button type="button" class="cd-btn-solid" (click)="onSendFromModal()">
            <ion-icon name="send-outline" aria-hidden="true"></ion-icon>
            Send
          </button>
        </div>
        @if (!editPromptMode()) {
          <button type="button" class="cd-link cd-link-block" (click)="startEditPrompt()">Edit prompt</button>
        }
      </div>
    </div>
  </ng-template>
</ion-modal>
