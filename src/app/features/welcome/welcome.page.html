<div class="welcome-root" role="main">
  <div class="welcome-hero">
    <h1 class="welcome-title">{{ appName }}</h1>
    <p class="welcome-tagline">Next-gen messenger</p>
    <p class="welcome-tagline">Communicate through AI images</p>
  </div>

  <div class="welcome-footer">
    <button type="button" class="welcome-cta" (click)="getStarted()">
      Get started
      <ion-icon name="arrow-forward-outline" aria-hidden="true"></ion-icon>
    </button>
    <p class="welcome-legal">
      By tapping &ldquo;Get started&rdquo;, you agree to our Terms of Service and Privacy Policy.
    </p>
  </div>
</div>
