<ion-header [translucent]="true" class="border-b border-zinc-200/80 dark:border-white/10">
  <ion-toolbar class="contacts-ion-toolbar">
    <ion-title class="text-center text-[1.05rem] font-bold text-zinc-900 dark:text-zinc-100">Contacts</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="false" class="contacts-ion-content">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large" class="font-bold tracking-tight text-zinc-900 dark:text-zinc-100">Contacts</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="min-h-full bg-white pb-4 dark:bg-slate-950">
    <div class="px-4 pb-3 pt-1">
      <app-search-field placeholder="Search contacts..." ariaLabel="Search contacts" />
    </div>

    <section class="mb-2" aria-labelledby="contacts-on-heading">
      <h2
        id="contacts-on-heading"
        class="m-0 bg-zinc-100 px-4 py-2.5 text-[11px] font-bold uppercase tracking-wide text-zinc-500 dark:bg-slate-900/80 dark:text-zinc-400"
      >
        {{ sectionOn }}
      </h2>
      <div class="m-0 bg-white p-0 dark:bg-slate-900" role="list">
        @for (c of onPicTalk(); track c.id) {
          <button
            type="button"
            class="flex w-full min-h-[72px] cursor-pointer appearance-none items-center border-0 border-b border-zinc-200/90 bg-white py-2.5 pl-3 pr-4 text-left font-inherit text-inherit active:bg-zinc-50 dark:border-white/10 dark:bg-slate-900 dark:active:bg-slate-800/80"
            role="listitem"
            (click)="openChat(c.id)"
            [attr.aria-label]="'Open chat with ' + c.name"
          >
            <div
              class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full text-base font-bold text-white"
              [style.background]="c.avatarColor"
            >
              {{ c.initials }}
            </div>
            <div class="mx-3 my-2 min-w-0 flex-1">
              <div class="mb-0.5 text-base font-bold text-zinc-900 dark:text-zinc-100">{{ c.name }}</div>
              <div class="text-sm text-zinc-500 dark:text-zinc-400">{{ c.phone }}</div>
            </div>
            <span
              class="pointer-events-none flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-blue-500 text-white dark:bg-sky-500"
              aria-hidden="true"
            >
              <ion-icon name="chatbubble-outline" class="text-xl"></ion-icon>
            </span>
          </button>
        }
      </div>
    </section>

    <section class="mb-2" aria-labelledby="contacts-invite-heading">
      <h2
        id="contacts-invite-heading"
        class="m-0 bg-zinc-100 px-4 py-2.5 text-[11px] font-bold uppercase tracking-wide text-zinc-500 dark:bg-slate-900/80 dark:text-zinc-400"
      >
        {{ sectionInvite }}
      </h2>
      <div class="m-0 bg-white p-0 dark:bg-slate-900" role="list">
        @for (c of inviteList(); track c.id) {
          <div
            class="flex min-h-[72px] items-center border-b border-zinc-200/90 bg-white py-2.5 pl-3 pr-3 dark:border-white/10 dark:bg-slate-900"
            role="listitem"
          >
            <div
              class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-zinc-300 text-white dark:bg-slate-600"
              aria-hidden="true"
            >
              <ion-icon name="person-add-outline" class="text-2xl"></ion-icon>
            </div>
            <div class="mx-1 my-2 min-w-0 flex-1">
              <div class="mb-0.5 text-base font-bold text-zinc-900 dark:text-zinc-100">{{ c.name }}</div>
              <div class="text-sm text-zinc-500 dark:text-zinc-400">{{ c.phone }}</div>
            </div>
            <ion-button
              type="button"
              class="contacts-invite-btn m-0 h-9 shrink-0 px-4 text-sm font-semibold [--border-radius:9999px] [--border-style:solid] [--border-width:1.5px] [--padding-end:16px] [--padding-start:16px]"
              fill="outline"
              size="small"
              (click)="onInvite(c, $event)"
            >
              Invite
            </ion-button>
          </div>
        }
      </div>
    </section>
  </div>
</ion-content>
