<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Мой AI Чат</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  
  <div class="chat-container">
    <div *ngFor="let msg of messages" [ngClass]="{'my-msg': msg.role === 'user', 'ai-msg': msg.role === 'assistant'}">
      <div class="bubble">
        {{ msg.text }}
      </div>
    </div>
  </div>

</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-item lines="none">
      <ion-input [(ngModel)]="newMessage" placeholder="Напиши что-нибудь..." (keyup.enter)="sendMessage()"></ion-input>
      <ion-button slot="end" fill="clear" (click)="sendMessage()">
        <ion-icon name="send"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-toolbar>
</ion-footer>
